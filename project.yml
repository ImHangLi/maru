name: Maru
options:
  bundleIdPrefix: com.imhangli
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Product copy is in App/Localizable.xcstrings. English is the source language (D017).
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  MaruKit:
    path: Packages/MaruKit
targets:
  Maru:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - package: MaruKit
        product: MaruCore
      - package: MaruKit
        product: MaruDatabase
      - package: MaruKit
        product: MaruNotifications
      # The Home Screen widgets (D048). XcodeGen embeds the extension in the app.
      - target: MaruWidgets
    settings:
      base:
        # Placeholder. Freeze the bundle ID before the first TestFlight build.
        PRODUCT_BUNDLE_IDENTIFIER: com.imhangli.maru
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Maru
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # The label scan of the add screen (D038). The system asks at the first tap on "Scan Label".
        INFOPLIST_KEY_NSCameraUsageDescription: Maru uses the camera to read the name on a label. Photos are not saved.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # The App Group holds the database that the widgets read (D048). The Info.plist adds the link scheme of a widget tap.
        CODE_SIGN_ENTITLEMENTS: Config/Maru.entitlements
        INFOPLIST_FILE: Config/Maru-Info.plist
        # The app icon is in App/Assets.xcassets. App/Icons.xcassets holds the form icons.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  MaruWidgets:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    dependencies:
      - package: MaruKit
        product: MaruCore
      - package: MaruKit
        product: MaruDatabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.imhangli.maru.widgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/MaruWidgets-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Maru
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Config/MaruWidgets.entitlements
        SKIP_INSTALL: YES
