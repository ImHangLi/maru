name: Maru
options:
  bundleIdPrefix: com.imhangli
  deploymentTarget:
    iOS: "17.0"
    # The Watch app (D071). watchOS 10 is the version that pairs with iOS 17.
    watchOS: "10.0"
  createIntermediateGroups: true
  # English is the source language. The six languages of the first release are in the String Catalogs (D051, D059).
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Product copy is in App/Localizable.xcstrings. The Info.plist texts are in App/InfoPlist.xcstrings.
    # The Siri phrases of the App Shortcuts are in App/AppShortcuts.xcstrings (D108).
    # The widgets and the Watch app have a catalog each: Widget/ and Watch/.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  MaruKit:
    path: Packages/MaruKit
schemes:
  # The Run action uses a StoreKit configuration for local tests of Maru Pro (D107).
  Maru:
    build:
      targets:
        Maru: all
    run:
      config: Debug
      storeKitConfiguration: Config/Maru.storekit
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  # Builds and runs the Watch app alone. The app does not embed it until 1.1 (D074).
  MaruWatch:
    build:
      targets:
        MaruWatch: all
    run:
      config: Debug
targets:
  Maru:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - package: MaruKit
        product: MaruCore
      - package: MaruKit
        product: MaruDatabase
      - package: MaruKit
        product: MaruNotifications
      - package: MaruKit
        product: MaruAnalytics
      # The Home Screen widgets (D048). XcodeGen embeds the extension in the app.
      - target: MaruWidgets
      # The alarm (D079). AlarmKit exists from iOS 26 and the app supports iOS 17, so the link is weak.
      - sdk: AlarmKit.framework
        weak: true
    settings:
      base:
        # Placeholder. Freeze the bundle ID before the first TestFlight build.
        PRODUCT_BUNDLE_IDENTIFIER: com.imhangli.maru
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Maru
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # The label scan (D038) and the item photo (D056) of the edit screen. The system asks at the first tap.
        INFOPLIST_KEY_NSCameraUsageDescription: Maru uses the camera to read the name on a label and to take a photo of an item. A label scan saves no photo.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # "Next Dose on Lock Screen", the Live Activity of Maru Pro (D110). The widget extension draws it. No push updates it.
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        # The iPhone is portrait only. Config/Maru-Info.plist has the four orientations of the iPad (D072).
        # The inner display of iPhone Duo ignores this lock and resizes the app (D106).
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Maru uses only the encryption of iOS, so the upload needs no export compliance document.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # The App Group holds the database that the widgets read (D048). The Info.plist adds the link scheme of a widget tap.
        CODE_SIGN_ENTITLEMENTS: Config/Maru.entitlements
        INFOPLIST_FILE: Config/Maru-Info.plist
        # Product analytics (D052). An empty key means no analytics: no switch, no notice, no network request.
        # Pass the values on the command line of a release build, for example MARU_ANALYTICS_KEY=phc_xxx. Keep a key out of Git.
        MARU_ANALYTICS_KEY: ""
        MARU_ANALYTICS_HOST: "https://us.i.posthog.com"
        # The app icon is in App/Assets.xcassets. App/Icons.xcassets holds the form icons.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # The photos of the debug sample items (App/Debug/SamplePhotos) are only in a debug build (D073).
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: "sample-photo-*.png"
  MaruWidgets:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    dependencies:
      - package: MaruKit
        product: MaruCore
      - package: MaruKit
        product: MaruDatabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.imhangli.maru.widgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/MaruWidgets-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Maru
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Config/MaruWidgets.entitlements
        SKIP_INSTALL: YES
  # The Watch app (D071). It has no database: it links only MaruCore, and the iPhone app makes each record.
  # The app does not embed it in 1.0 (D074). To embed it again, add `- target: MaruWatch` to the dependencies of Maru.
  MaruWatch:
    type: application
    platform: watchOS
    sources:
      - Watch
      - Shared/DayPartTitle.swift
      - Shared/ItemTint.swift
      - Shared/TimeFormat.swift
      - Widget/CapsuleMark.swift
      # The app icon. The set has an entry for watchOS.
      - App/Assets.xcassets
    dependencies:
      - package: MaruKit
        product: MaruCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.imhangli.maru.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Maru
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.imhangli.maru
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
