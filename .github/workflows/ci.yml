name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Find which checks the change needs. A change to docs or the site needs no build.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      core: ${{ steps.paths.outputs.core }}
      app: ${{ steps.paths.outputs.app }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # With no usable base (a new branch or a forced push), run every check.
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "core=true" >> "$GITHUB_OUTPUT"
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE" "$GITHUB_SHA")
          echo "$files"
          match() { echo "$files" | grep -qE "$1" && echo true || echo false; }
          echo "core=$(match '^(Packages/|\.github/workflows/)')" >> "$GITHUB_OUTPUT"
          echo "app=$(match '^(App/|Widget/|Watch/|Shared/|Config/|Packages/|project\.yml|\.github/workflows/)')" >> "$GITHUB_OUTPUT"

  core:
    # Build and test the platform-neutral package. It needs no simulator.
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: swift build --package-path Packages/MaruKit
      - run: swift test --package-path Packages/MaruKit

  app:
    # Build the app for the iOS Simulator. The app embeds the Watch app (D111), so the build also compiles the Watch
    # app for the watchOS Simulator. macOS runners are free for public repositories.
    # The app needs Xcode 27. The macos-26 image has only Xcode 26, so use the Xcode 27 image (public preview).
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: .build/SourcePackages
          key: spm-${{ hashFiles('Packages/MaruKit/Package.resolved') }}
      - run: brew install xcodegen
      - run: xcodegen generate
      # One architecture and no index store: the build is only a compile check.
      - run: >-
          xcodebuild -project Maru.xcodeproj -scheme Maru
          -destination 'generic/platform=iOS Simulator'
          -clonedSourcePackagesDirPath .build/SourcePackages
          ARCHS=arm64 ONLY_ACTIVE_ARCH=YES COMPILER_INDEX_STORE_ENABLE=NO
          CODE_SIGNING_ALLOWED=NO build
      # An archive of the app must have the Watch app (D111).
      - run: grep -q 'MaruWatch.app in Embed Watch Content' Maru.xcodeproj/project.pbxproj
      # The debug sample photos must stay out of a release build (D073).
      - run: >-
          xcodebuild -project Maru.xcodeproj -target Maru -configuration Release -showBuildSettings
          | grep -E 'EXCLUDED_SOURCE_FILE_NAMES = sample-photo-\*\.png$'
